name: Probe report sources (temporary)
on:
  push:
    branches: [probe-reports]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pypdf==5.4.0
      - name: Run calendar update
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          git fetch --no-tags origin refs/heads/calendar-live
          git show FETCH_HEAD:docs/terminal/calendar-feed.json > "$RUNNER_TEMP/out/calendar-feed.json"
          python scripts/update-calendar.py "$RUNNER_TEMP/out/calendar-feed.json" > "$RUNNER_TEMP/out/log.txt" 2>&1; echo "exit $?" >> "$RUNNER_TEMP/out/log.txt"
          cat "$RUNNER_TEMP/out/log.txt"
      - name: Publish
        run: |
          cd "$RUNNER_TEMP/out"
          git init -q && git checkout -q -b probe-reports-out && git add -A
          git -c user.name=probe -c user.email=probe@example.com commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/probe-reports-out
